<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Amlan Bhowmik — Frontend Developer, UI/UX Designer. Design with purpose. Build with care.">
<defs>
<radialGradient id="ambient" cx="50%" cy="48%" r="54%"><stop stop-color="#503021" stop-opacity=".35"/><stop offset=".50" stop-color="#281e1c" stop-opacity=".16"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
<linearGradient id="orange" x1="0" x2="1"><stop stop-color="#fca15c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="hairline" x1="0" x2="1"><stop stop-color="#f97316" stop-opacity="0"/><stop offset=".5" stop-color="#fb923c" stop-opacity=".75"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></linearGradient>
<clipPath id="underline"><rect x="514" y="261" width="172" height="2" rx="1"/></clipPath>
</defs>
<style>
text{font-family:Inter,Geist,"Segoe UI",Arial,sans-serif}
@keyframes glow{0%,100%{opacity:.48}50%{opacity:.87}}
@keyframes shift{0%,100%{opacity:.3;transform:translateY(5px)}50%{opacity:.65;transform:translateY(-4px)}}
@keyframes highlight{0%,100%{opacity:.25;transform:translateX(-18px)}50%{opacity:1;transform:translateX(18px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.ambient{animation:glow 8s ease-in-out infinite}.detail{animation:shift 9s ease-in-out infinite}.shine{animation:highlight 3.8s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.ambient,.detail,.shine,.cursor{animation:none}}
</style>
<rect width="1200" height="310" fill="#0d1117"/>
<ellipse class="ambient" cx="600" cy="152" rx="540" ry="225" fill="url(#ambient)"/>
<g class="detail" fill="none" stroke="#875337" stroke-width="1" opacity=".35">
 <path d="M44 218 C160 167 188 108 340 115"/>
 <path d="M860 119 C1007 91 1080 156 1172 194"/>
 <path d="M68 247 C172 209 221 202 316 212" opacity=".5"/>
 <path d="M907 220 C1012 195 1099 240 1160 255" opacity=".5"/>
</g>
<text x="600" y="61" text-anchor="middle" fill="#a4a8b1" font-size="15" font-weight="600" letter-spacing="2.1">FRONTEND  /  DESIGN  /  SYSTEMS</text>
<text x="600" y="151" text-anchor="middle" font-size="83" font-weight="750" letter-spacing="-4"><tspan fill="#f7f7f8">Amlan </tspan><tspan fill="url(#orange)">Bhowmik</tspan></text>
<text x="600" y="195" text-anchor="middle" fill="#c4c7cf" font-size="24" font-weight="500">Frontend Developer  ·  UI/UX Designer</text>
<text x="600" y="244" text-anchor="middle" fill="#f1f2f4" font-size="23" font-weight="550">Design with purpose. <tspan fill="#fb923c" font-weight="700">Build with care.</tspan><tspan class="cursor" fill="#fb923c"> |</tspan></text>
<rect x="514" y="261" width="172" height="2" rx="1" fill="url(#hairline)"/>
<g clip-path="url(#underline)"><rect class="shine" x="569" y="261" width="62" height="2" rx="1" fill="#fed7aa"/></g>
<text x="600" y="296" text-anchor="middle" fill="#8f949e" font-size="13" letter-spacing="1.8">THOUGHTFUL INTERFACES. PRACTICAL ENGINEERING.</text>
</svg>