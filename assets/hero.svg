<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-label="Amlan Bhowmik — Frontend Developer and UI/UX Designer">
<defs>
<linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
</defs>
<style>
text{font-family:Inter,Geist,"Segoe UI",Arial,sans-serif}
@keyframes fade{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.accent{animation:fade 3s ease-in-out infinite}.cursor{animation:blink 1.15s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.accent,.cursor{animation:none}}
</style>
<rect width="1200" height="276" fill="#0d1117"/>
<circle cx="392" cy="37" r="4" fill="#f97316"/>
<text x="600" y="42" text-anchor="middle" fill="#a1a1aa" font-size="16" font-weight="600" letter-spacing="2">FRONTEND / DESIGN / SYSTEMS</text>
<text x="600" y="125" text-anchor="middle" font-size="80" font-weight="750" letter-spacing="-3.8"><tspan fill="#f7f7f8">Amlan </tspan><tspan fill="url(#orange)">Bhowmik</tspan></text>
<text x="600" y="169" text-anchor="middle" fill="#bbc0c9" font-size="25" font-weight="500">Frontend Developer · UI/UX Designer</text>
<text x="600" y="209" text-anchor="middle" fill="#f0f1f2" font-size="24" font-weight="560">Design with purpose. <tspan fill="#fb923c" font-weight="720">Build with care.</tspan><tspan class="cursor" fill="#fb923c"> |</tspan></text>
<rect x="520" y="229" width="160" height="2" rx="1" fill="#423125"/>
<rect class="accent" x="555" y="229" width="90" height="2" rx="1" fill="#fb923c"/>
<text x="600" y="258" text-anchor="middle" fill="#969ca6" font-size="14" letter-spacing="1.8">BUILDING THOUGHTFUL DIGITAL EXPERIENCES</text>
</svg>