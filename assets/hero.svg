<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Amlan Bhowmik — Frontend Developer and UI/UX Designer">
<defs>
<radialGradient id="ambient"><stop stop-color="#57301e" stop-opacity=".33"/><stop offset=".56" stop-color="#2b1d18" stop-opacity=".12"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
<linearGradient id="line" x1="0" x2="1"><stop stop-color="#fb923c" stop-opacity="0"/><stop offset=".5" stop-color="#fb923c"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></linearGradient>
</defs>
<style>
text{font-family:Inter,Geist,"Segoe UI",Arial,sans-serif}
@keyframes breathe{0%,100%{opacity:.48}50%{opacity:.86}}
@keyframes shimmer{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.ambient{animation:breathe 7s ease-in-out infinite}.line{animation:shimmer 3.2s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.ambient,.line,.cursor{animation:none}}
</style>
<rect width="1200" height="270" fill="#0d1117"/>
<ellipse class="ambient" cx="600" cy="122" rx="490" ry="215" fill="url(#ambient)"/>
<text x="600" y="89" text-anchor="middle" font-size="86" font-weight="750" letter-spacing="-4.2" fill="#fafafa">Amlan Bhowmik</text>
<text x="600" y="135" text-anchor="middle" fill="#c2c5cd" font-size="25" font-weight="500">Frontend Developer · UI/UX Designer</text>
<text x="600" y="183" text-anchor="middle" fill="#f1f2f4" font-size="24" font-weight="560">Design with purpose. <tspan fill="#fb923c" font-weight="700">Build with care.</tspan><tspan class="cursor" fill="#fb923c"> |</tspan></text>
<rect x="523" y="201" width="154" height="2" rx="1" fill="#493226"/>
<rect class="line" x="540" y="201" width="120" height="2" rx="1" fill="url(#line)"/>
<text x="600" y="239" text-anchor="middle" fill="#989da7" font-size="14" letter-spacing="1.7">THOUGHTFUL INTERFACES. PRACTICAL ENGINEERING.</text>
</svg>