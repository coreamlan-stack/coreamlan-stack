<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="288" viewBox="0 0 1200 288" role="img" aria-label="Amlan Bhowmik, frontend developer and UI UX designer">
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#27272a" stroke-width=".65" opacity=".32"/></pattern><linearGradient id="trail"><stop stop-color="#60a5fa" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>
<style>
text{font-family:Geist,Inter,"Segoe UI",Arial,sans-serif}
@keyframes sweep{from{transform:translateX(-250px)}to{transform:translateX(1200px)}}
@keyframes beat{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.scan{animation:sweep 5.8s linear infinite}.status{animation:beat 2.4s ease-in-out infinite}.cursor{animation:caret 1.2s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.scan,.status,.cursor{animation:none}}
</style>
<rect width="1200" height="288" rx="13" fill="#0d1117"/><rect width="1200" height="288" rx="13" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="286" rx="12" stroke="#30363d" fill="none"/>
<rect x="413" y="29" width="374" height="32" rx="16" fill="#151c25" stroke="#303b45"/>
<circle class="status" cx="431" cy="45" r="4" fill="#22c55e"/><text x="450" y="50" font-size="13" font-weight="600" letter-spacing="1.4" fill="#a6b3c2">DESIGNER MINDSET · DEVELOPER HANDS</text>
<text x="600" y="135" font-size="73" font-weight="740" letter-spacing="-3.2" fill="#f8fafc" text-anchor="middle">Amlan <tspan fill="#60a5fa">Bhowmik</tspan></text>
<text x="600" y="177" font-size="22" font-weight="450" fill="#b2bdca" text-anchor="middle">Frontend Developer <tspan fill="#607080">/</tspan> UI &amp; UX Designer</text>
<text x="600" y="220" font-size="17" fill="#8794a4" text-anchor="middle">Design with purpose. Build with care.<tspan class="cursor" fill="#22c55e"> |</tspan></text>
<rect x="0" y="281" width="1200" height="2" fill="#25303d"/><rect class="scan" y="281" width="245" height="2" fill="url(#trail)"/>
</svg>