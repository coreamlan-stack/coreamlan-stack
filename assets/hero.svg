<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Amlan Bhowmik — Design with purpose. Build with care.">
<defs><linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FB923C"/><stop offset=".5" stop-color="#FC6D26"/><stop offset="1" stop-color="#F97316"/></linearGradient><linearGradient id="shine"><stop stop-color="#FC6D26" stop-opacity="0"/><stop offset=".5" stop-color="#FC6D26"/><stop offset="1" stop-color="#FB923C" stop-opacity="0"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#27272a" fill="none" stroke-opacity=".4" stroke-width="1"/></pattern></defs>
<style>
text{font-family:Inter,Geist,"Segoe UI",Arial,sans-serif}
@keyframes glide{from{transform:translateX(-270px)}to{transform:translateX(1150px)}}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes blink{0%,48%{opacity:1}50%,100%{opacity:0}}
.moving{animation:glide 4.6s linear infinite}.pulse{animation:breathe 2s ease-in-out infinite}.cursor{animation:blink 1.2s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.moving,.pulse,.cursor{animation:none}}
</style>
<rect width="1200" height="360" rx="14" fill="#0D1117"/><rect width="1200" height="360" rx="14" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="358" rx="13" stroke="#30363d" fill="none" stroke-width="2"/>
<rect x="435" y="35" width="330" height="30" rx="15" fill="#151a21" stroke="#37302b"/>
<circle cx="453" cy="50" r="4" fill="#FC6D26" class="pulse"/>
<text x="472" y="55" fill="#c2c6cf" font-size="13" font-weight="600" letter-spacing="1.1">FRONTEND  /  DESIGN  /  SYSTEMS</text>
<text x="600" y="142" fill="#F7F7F8" font-size="75" letter-spacing="-3.7" font-weight="750" text-anchor="middle">Amlan Bhowmik</text>
<text x="600" y="184" fill="#A1A1AA" font-size="22" font-weight="450" text-anchor="middle">Software Developer  ·  UI/UX Designer</text>
<text x="600" y="242" fill="#fafafa" font-size="32" font-weight="650" text-anchor="middle">Design with purpose.</text>
<text x="600" y="286" fill="url(#orange)" font-size="38" font-weight="750" letter-spacing="-.9" text-anchor="middle">Build with care.<tspan class="cursor" fill="#FC6D26"> |</tspan></text>
<rect x="350" y="312" width="500" height="2" rx="1" fill="#35302e"/>
<rect class="moving" x="0" y="312" width="250" height="2" rx="1" fill="url(#shine)"/>
<text x="600" y="339" fill="#777985" font-size="12" text-anchor="middle" letter-spacing="2">BUILDING THOUGHTFUL DIGITAL EXPERIENCES</text>
</svg>