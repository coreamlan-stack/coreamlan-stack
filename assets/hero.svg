<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="302" viewBox="0 0 1200 302" role="img" aria-label="Amlan Bhowmik — Frontend Developer and UI/UX Designer">
<defs>
<linearGradient id="orange" x1="0" x2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<linearGradient id="shine"><stop stop-color="#fc6d26" stop-opacity="0"/><stop offset=".5" stop-color="#fc6d26"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#27272a" stroke-opacity=".28" fill="none"/></pattern>
<clipPath id="clip"><rect width="1200" height="302" rx="14"/></clipPath>
</defs>
<style>
text{font-family:Inter,Geist,"Segoe UI",Arial,sans-serif}
@keyframes glide{from{transform:translateX(-260px)}to{transform:translateX(1200px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes cursor{0%,48%{opacity:1}50%,100%{opacity:0}}
.moving{animation:glide 4.6s linear infinite}.pulse{animation:pulse 2.2s ease-in-out infinite}.cursor{animation:cursor 1.15s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.moving,.pulse,.cursor{animation:none}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="302" fill="#0d1117"/><rect width="1200" height="302" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="300" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>
<rect x="423" y="25" width="354" height="31" rx="15.5" fill="#171b21" stroke="#443329"/>
<circle class="pulse" cx="443" cy="40.5" r="4.5" fill="#fc6d26"/>
<text x="462" y="46" fill="#c2c6cf" font-size="14" font-weight="600" letter-spacing="1.1">FRONTEND  /  DESIGN  /  SYSTEMS</text>
<text x="600" y="133" text-anchor="middle" font-size="80" font-weight="750" letter-spacing="-3.8"><tspan fill="#f7f7f8">Amlan </tspan><tspan fill="url(#orange)">Bhowmik</tspan></text>
<text x="600" y="177" text-anchor="middle" fill="#bbc0c9" font-size="25" font-weight="500">Frontend Developer  ·  UI/UX Designer</text>
<text x="600" y="219" text-anchor="middle" fill="#f0f1f2" font-size="24" font-weight="560">Design with purpose. <tspan fill="#fb923c" font-weight="720">Build with care.</tspan><tspan class="cursor" fill="#fb923c"> |</tspan></text>
<rect x="365" y="251" width="470" height="2" fill="#37312c" rx="1"/><rect class="moving" x="0" y="251" width="260" height="2" rx="1" fill="url(#shine)"/>
<text x="600" y="279" text-anchor="middle" font-size="14" fill="#969ca6" letter-spacing="1.8">BUILDING THOUGHTFUL DIGITAL EXPERIENCES</text>
</g>
</svg>