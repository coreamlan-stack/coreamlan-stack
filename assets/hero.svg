<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Amlan Bhowmik — Frontend developer and UI/UX designer">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#101E31"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#62D7FF"/><stop offset="1" stop-color="#4A86FF"/></linearGradient>
    <linearGradient id="track" x1="0" x2="1"><stop stop-color="#62D7FF" stop-opacity="0"/><stop offset=".5" stop-color="#62D7FF"/><stop offset="1" stop-color="#62D7FF" stop-opacity="0"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7DA7D6" opacity=".13"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="338" rx="20"/></clipPath>
  </defs>
  <style>
    @keyframes glow { 0%,100%{opacity:.65} 50%{opacity:1} }
    @keyframes travel {from{transform:translateX(-300px)}to{transform:translateX(1220px)}}
    @keyframes blink {0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes drift {0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    .moving{animation:travel 5.5s linear infinite}.cursor{animation:blink 1.15s steps(1,end) infinite}.orb{animation:drift 7s ease-in-out infinite}.pulse{animation:glow 2.5s ease-in-out infinite}
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#dots)"/>
    <circle class="orb" cx="1020" cy="112" r="140" fill="#1D5B99" opacity=".14"/><circle cx="1130" cy="310" r="210" fill="#2563EB" opacity=".08"/>
    <rect x="48" y="38" width="170" height="29" rx="14.5" fill="#122D42" stroke="#275975"/>
    <circle class="pulse" cx="65" cy="52" r="4" fill="#5CD9C3"/>
    <text x="79" y="57" fill="#B7E7F7" font-size="12" font-weight="600" letter-spacing="1.2">OPEN TO CONNECT</text>
    <text x="48" y="151" fill="#F5F8FF" font-size="66" font-weight="750" letter-spacing="-2.4">Amlan <tspan fill="url(#blue)">Bhowmik</tspan></text>
    <text x="50" y="200" fill="#B8C9DF" font-size="22" font-weight="500">Frontend Developer  <tspan fill="#55728E">/</tspan>  UI &amp; UX Designer</text>
    <text x="50" y="244" fill="#7F9CB7" font-size="17">Building thoughtful interfaces for real-world products.</text>
    <text x="50" y="295" fill="#5AC5F4" font-size="14" font-weight="600" letter-spacing="1.8">DESIGN  •  DEVELOP  •  REFINE</text>
    <rect x="845" y="79" width="275" height="174" rx="13" fill="#111F32" stroke="#34526C"/>
    <rect x="845" y="79" width="275" height="32" rx="13" fill="#1A3048"/><rect x="845" y="100" width="275" height="11" fill="#1A3048"/>
    <circle cx="866" cy="95" r="4" fill="#FF718A"/><circle cx="881" cy="95" r="4" fill="#FFC368"/><circle cx="896" cy="95" r="4" fill="#5DD8AE"/>
    <text x="868" y="144" fill="#7D9CB8" font-family="monospace" font-size="15">const developer = {</text>
    <text x="888" y="170" fill="#67D8F8" font-family="monospace" font-size="15">craft: <tspan fill="#DDEAF9">'frontend'</tspan>,</text>
    <text x="888" y="195" fill="#67D8F8" font-family="monospace" font-size="15">mindset: <tspan fill="#DDEAF9">'design'</tspan></text>
    <text x="868" y="221" fill="#7D9CB8" font-family="monospace" font-size="15">};<tspan class="cursor" fill="#66D6F4"> ▍</tspan></text>
    <rect x="0" y="331" width="1200" height="3" fill="#1F405C"/><rect class="moving" x="0" y="331" width="300" height="3" fill="url(#track)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="none" stroke="#28415B" stroke-width="2"/>
</svg>