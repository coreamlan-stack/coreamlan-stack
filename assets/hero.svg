<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Amlan Bhowmik — Software Developer and UI/UX Designer">
<defs>
<linearGradient id="fade" x1="0" x2="1"><stop stop-color="#a1a1aa" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a1a1aa" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#27272a" stroke-opacity=".24" stroke-width="1"/></pattern>
</defs>
<style>
text{font-family:Inter,Geist,"Segoe UI",Arial,sans-serif}
@keyframes move{0%{transform:translateX(-270px)}100%{transform:translateX(1250px)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
.line{animation:move 5s linear infinite}.dot{animation:breathe 2.5s ease-in-out infinite}.caret{animation:cursor 1.1s steps(1,end) infinite}
@media(prefers-reduced-motion:reduce){.line,.dot,.caret{animation:none}}
</style>
<rect width="1200" height="300" rx="14" fill="#09090b"/>
<rect width="1200" height="300" rx="14" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="298" rx="13" fill="none" stroke="#27272a" stroke-width="2"/>
<circle class="dot" cx="447" cy="62" r="4" fill="#60a5fa"/>
<text x="600" y="67" text-anchor="middle" fill="#a1a1aa" font-size="14" letter-spacing="3" font-weight="600">SOFTWARE DEVELOPMENT  /  INTERFACE DESIGN</text>
<text x="600" y="147" text-anchor="middle" fill="#fafafa" font-weight="750" font-size="69" letter-spacing="-3.1">Amlan Bhowmik</text>
<text x="600" y="189" text-anchor="middle" fill="#a1a1aa" font-weight="450" font-size="23">Software Developer <tspan fill="#52525b">·</tspan> UI/UX Designer</text>
<text x="600" y="230" text-anchor="middle" fill="#d4d4d8" font-size="17">Design with purpose. Build with care.<tspan class="caret" fill="#60a5fa"> |</tspan></text>
<rect x="390" y="259" width="420" height="2" rx="1" fill="#27272a"/>
<rect class="line" x="0" y="259" width="230" height="2" fill="url(#fade)"/>
</svg>